[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "privatier"
version = "0.1.0"
description = "Local, auditable pseudonymisation of research project folders before working with cloud AI."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "openpyxl>=3.1",
    "pyreadstat>=1.2",
    "python-docx>=1.1",
    "pypdf>=4.0",
    "cryptography>=42",
]

[project.optional-dependencies]
# Local AI name recognition (GLiNER). Large download (PyTorch); recommended on Apple Silicon / modern laptops.
ai = ["gliner>=0.2.13", "protobuf>=4"]
dev = ["pytest>=8", "reportlab>=4"]
# The desktop window.
app = ["pywebview>=5.3"]
# Building Privatier.app and the dmg (see packaging/).
build = ["pyinstaller>=6.22", "dmgbuild>=1.6", "pillow>=10"]

[project.scripts]
privatier = "privatier.cli:main"
privatier-app = "privatier.app.window:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"privatier.app" = ["ui.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
